name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Optional repository secrets (Settings → Secrets and variables → Actions), each base64-encoded:
      #   DIPLAY_IDENTITY_PK8_B64     offline-mfi/identity.pk8     → APK that can connect to an iPhone
      #   DIPLAY_CERTIFICATE_P7B_B64  offline-mfi/certificate.p7b
      #   RELEASE_KEYSTORE_B64 / RELEASE_KEYSTORE_PASSWORD   the release keystore (alias xiaosha), so each build updates the last install in place
      IDENTITY_PK8_B64: ${{ secrets.DIPLAY_IDENTITY_PK8_B64 }}
      CERTIFICATE_P7B_B64: ${{ secrets.DIPLAY_CERTIFICATE_P7B_B64 }}
      RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358 cmake;3.22.1
      - uses: gradle/actions/setup-gradle@v4
      - name: Install release signing key
        run: |
          if [ -n "$RELEASE_KEYSTORE_B64" ]; then
            echo "$RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEY_ALIAS=xiaosha" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$RELEASE_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::warning::RELEASE_KEYSTORE_B64 is not set; signing with a one-off key, so this APK cannot update an earlier install."
            pw=$(openssl rand -hex 16)
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storetype PKCS12 -storepass "$pw" -keypass "$pw" \
              -alias xiaosha -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=XiaoSha Multiplay"
            echo "ANDROID_KEY_ALIAS=xiaosha" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$pw" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$pw" >> "$GITHUB_ENV"
          fi
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Provide CarPlay authentication assets
        if: env.IDENTITY_PK8_B64 != '' && env.CERTIFICATE_P7B_B64 != ''
        run: |
          dir="$RUNNER_TEMP/diplay-auth"
          mkdir -p "$dir/offline-mfi"
          echo "$IDENTITY_PK8_B64" | base64 -d > "$dir/offline-mfi/identity.pk8"
          echo "$CERTIFICATE_P7B_B64" | base64 -d > "$dir/offline-mfi/certificate.p7b"
          echo "DIPLAY_AUTH_ASSETS_DIR=$dir" >> "$GITHUB_ENV"
      - name: Build standalone release APK
        if: env.DIPLAY_AUTH_ASSETS_DIR != ''
        run: ./gradlew :mobile:assembleStandaloneRelease --stacktrace
      - name: Build source-only release APK (cannot connect to an iPhone)
        if: env.DIPLAY_AUTH_ASSETS_DIR == ''
        run: |
          echo "::warning::CarPlay authentication secrets are not set; this APK cannot connect to an iPhone."
          ./gradlew :mobile:assembleRelease --stacktrace
      - name: Remove authentication assets
        if: always()
        run: rm -rf "$RUNNER_TEMP/diplay-auth" "$RUNNER_TEMP/release.jks"
      - name: Publish interface screenshots to the ui-screenshots branch
        if: always() && hashFiles('common/build/screenshots/*.png') != ''
        run: |
          dir=$(mktemp -d)
          cp common/build/screenshots/*.png "$dir"/
          cd "$dir"
          git init -q -b ui-screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Interface screenshots for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ui-screenshots
      - name: Interface screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: common/build/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: xiaosha-multiplay-${{ github.sha }}
          path: mobile/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
